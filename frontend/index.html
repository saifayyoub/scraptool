<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduFeed Reader</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #fff; --bg2: #fafafa; --bg3: #eef2f5;
  --fg: #222; --fg2: #555; --fg3: #999;
  --border: #ddd; --border2: #eee; --border3: #e3e3e3;
  --hover: #f2f2f2; --active: #cfe3f7; --accent: #1a73e8;
  --badge-bg: #dbeafe; --badge-fg: #1d4ed8;
  --shadow: rgba(0,0,0,0.15);
}
.dark {
  --bg: #060b24; --bg2: #0c1330; --bg3: #111a3d;
  --fg: #d0d8e8; --fg2: #8899b4; --fg3: #5a6a8a;
  --border: #16204a; --border2: #16204a; --border3: #16204a;
  --hover: #111a3d; --active: #1a2a5c; --accent: #5b9cf5;
  --badge-bg: #1a2a5c; --badge-fg: #7dd3fc;
  --shadow: rgba(0,0,0,0.6);
}
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--fg); }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); padding: 6px 10px;
  background: var(--bg2); height: 36px;
}
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; }
.toolbar-btn {
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  color: var(--fg2); cursor: pointer; border-radius: 3px; font-size: 13px;
}
.toolbar-btn:hover { background: var(--hover); }
.layout { display: flex; height: calc(100vh - 36px); }
.sidebar {
  width: 220px; border-right: 1px solid var(--border); padding: 6px 0;
  background: var(--bg); flex-shrink: 0; overflow-y: auto;
}
.sidebar .nav-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  font-size: 13px; color: var(--fg); cursor: pointer;
}
.sidebar .nav-item:hover { background: var(--hover); }
.sidebar .nav-item.selected { background: var(--active); }
.sidebar hr { border: none; border-top: 1px solid var(--border3); margin: 5px 0; }
.feed-item {
  display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer;
}
.feed-item:hover { background: var(--hover); }
.feed-item.selected { background: var(--active); }
.favicon-dot {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
}
.favicon-dot.orange { background: #e0721d; }
.favicon-dot.red { background: #cc2222; }
.favicon-dot.teal { background: #1aa6a0; }
.favicon-dot.purple { background: #7a3fc4; }
.favicon-dot.green { background: #3fae4e; }
.favicon-dot.darkblue { background: #1c3a6b; }
.favicon-dot.gray { background: #888; }
.favicon-dot.brown { background: #8b4513; }
.favicon-dot.marine { background: #2c5e8a; }
.favicon-dot.pink { background: #c44a7a; }
.feed-badge {
  margin-left: auto; background: var(--badge-bg); color: var(--badge-fg);
  font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; min-width: 16px; text-align: center; line-height: 16px;
}
.feed-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.article-list {
  width: 380px; overflow-y: auto; flex-shrink: 0; background: var(--bg);
}
.resize-handle {
  width: 5px; cursor: col-resize; flex-shrink: 0;
  background: var(--border); position: relative; z-index: 10;
  transition: background 0.15s;
}
.resize-handle:hover, .resize-handle.active { background: var(--accent); }
.day-header {
  background: var(--bg3); text-align: center; font-weight: 600;
  font-size: 12px; padding: 5px 0; color: var(--fg2); border-bottom: 1px solid var(--border);
}
.article-row {
  padding: 8px 12px; border-bottom: 1px solid var(--border2); cursor: pointer;
}
.article-row:hover { background: var(--hover); }
.article-row.selected { background: var(--active); }
.article-row .title {
  font-size: 13px; direction: rtl; text-align: right;
  color: var(--fg); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.article-row .meta {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--fg2);
}
.article-row .meta .feed-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.article-row .meta .dot {
  width: 7px; height: 7px; border-radius: 50%; border: 1px solid #999; flex-shrink: 0;
}
.article-row .meta .dot.unread { background: #3b82f6; border-color: #3b82f6; }
.article-row .meta .time { white-space: nowrap; }
.tag-new { font-size: 9px; font-weight: 700; color: #fff; background: #16a34a; padding: 0 5px; border-radius: 3px; line-height: 15px; }
.tag-updated { font-size: 9px; font-weight: 700; color: #fff; background: #ea580c; padding: 0 5px; border-radius: 3px; line-height: 15px; }
.reading-pane { flex: 1; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
.reading-pane .pane-inner { max-width: 780px; margin: 0 auto; padding: 18px 30px; width: 100%; }
.article-toolbar {
  display: flex; align-items: center; gap: 12px; color: var(--fg2); margin-bottom: 12px; flex-wrap: wrap;
}
.pane-btn {
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; font-size: 12px; color: var(--fg2); padding: 3px 8px; border-radius: 4px;
}
.pane-btn:hover { background: var(--hover); }
.pane-btn i { font-size: 13px; }
.article-headline {
  direction: rtl; text-align: right;
  font-size: 22px; font-weight: 700; line-height: 1.6;
  color: var(--fg); margin-bottom: 10px;
}
.source-line {
  font-size: 12px; color: var(--fg2); margin-bottom: 14px;
}
.article-image {
  width: 100%; max-width: 620px; display: block; margin-bottom: 14px; border: 1px solid var(--border);
}
.article-body {
  direction: rtl; text-align: right;
  font-size: 16px; line-height: 1.8; color: var(--fg);
}
.article-body a { color: var(--accent); }
.article-body img { max-width: 100%; height: auto; }
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
.toast {
  padding: 8px 16px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 12px var(--shadow);
  margin-top: 8px; animation: slideUp 0.25s ease;
}
.toast-success { background: #166534; color: white; }
.toast-error { background: #991b1b; color: white; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.search-box {
  width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 6px 10px;
  font-size: 12px; outline: none; background: var(--bg2); color: var(--fg);
}
.empty-state { padding: 30px; text-align: center; color: var(--fg3); font-size: 13px; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: flex;
  align-items: center; justify-content: center;
}
.modal-content {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 20px; width: 420px; max-width: 90vw; box-shadow: 0 8px 30px var(--shadow);
}
.settings-input {
  width: 100%; padding: 7px 10px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg2); color: var(--fg); outline: none;
}
.settings-input:focus { border-color: var(--accent); }
.settings-btn {
  padding: 7px 16px; font-size: 13px; border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; background: var(--bg2); color: var(--fg);
}
.settings-btn:hover { background: var(--hover); }
.context-menu {
  position: fixed; z-index: 1000; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 4px 16px var(--shadow); min-width: 180px; padding: 4px 0;
}
.context-menu .cm-item {
  padding: 7px 14px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--fg);
}
.context-menu .cm-item:hover { background: var(--hover); }
.context-menu .cm-sep { border: none; border-top: 1px solid var(--border); margin: 3px 8px; }
.prop-results { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; margin-top: 2px; }
.prop-results .pr-item { padding: 5px 8px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border2); }
.prop-results .pr-item:hover { background: var(--hover); }
.prop-results .pr-item:last-child { border-bottom: none; }
.props-row { display: flex; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border2); }
.props-label { width: 140px; color: var(--fg3); flex-shrink: 0; }
.props-value { flex: 1; color: var(--fg); word-break: break-all; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg3); }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <span class="toolbar-btn" id="sync-btn" title="Refresh"><i class="fas fa-sync-alt"></i></span>
    <span class="toolbar-btn" id="btn-add-feed" title="Add feed"><i class="fas fa-plus"></i></span>
    <span class="toolbar-btn" id="btn-add-folder" title="Add folder"><i class="fas fa-folder-plus"></i></span>
  </div>
  <div class="toolbar-right">
    <span style="font-size:11px;color:var(--fg2);" id="feed-count"></span>
    <span class="toolbar-btn" id="btn-settings" title="Settings"><i class="fas fa-cog"></i></span>
    <span class="toolbar-btn" id="dark-mode-toggle" title="Dark mode"><i class="fas fa-moon"></i></span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="nav-item" id="nav-all" onclick="filterAll()"><i class="far fa-newspaper" style="width:16px;text-align:center;"></i> All Articles</div>
    <div class="nav-item" id="nav-starred" onclick="filterStarred()"><i class="far fa-star" style="width:16px;text-align:center;"></i> Starred</div>
    <div class="nav-item" id="nav-done" onclick="filterDone()"><i class="fas fa-check" style="width:16px;text-align:center;color:#2e9e3f;"></i> Done</div>
    <hr>
    <div style="padding:4px 14px;font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:0.5px;">Feeds</div>
    <div id="feed-list"></div>
  </div>

  <div class="article-list" id="article-list-pane">
    <input class="search-box" id="search-input" placeholder="Search..." />
    <div id="article-rows"></div>
  </div>
  <div class="resize-handle" id="resize-handle"></div>

  <div class="reading-pane" id="reading-pane">
    <div class="pane-inner" id="pane-inner">
      <div class="article-toolbar" id="article-toolbar">
        <span class="pane-btn" id="btn-star-toggle" title="Star"><i class="far fa-star"></i> Star</span>
        <span class="pane-btn" id="btn-done" title="Mark done"><i class="fas fa-check" style="color:#2e9e3f;"></i> Done</span>
        <span class="pane-btn" id="btn-posted" title="Post to Blogger"><i class="fas fa-share-nodes" style="color:#ff5722;"></i> Blogger</span>
        <span class="pane-btn" id="btn-copy-html" title="Copy HTML"><i class="fas fa-code" style="color:var(--accent);"></i> HTML</span>
        <span class="pane-btn" id="btn-fulltext" title="Fetch full article text"><i class="fas fa-file-lines" style="color:var(--accent);"></i> Full text</span>
        <span class="pane-btn" id="btn-unread" title="Toggle read"><i class="far fa-envelope"></i></span>
        <span class="pane-btn" id="btn-delete-article" title="Delete"><i class="fas fa-trash" style="color:#cc2222;"></i></span>
      </div>
      <div id="article-content">
        <div class="empty-state">Select an article to read</div>
      </div>
    </div>
  </div>
</div>

<div id="context-menu" class="context-menu" style="display:none"></div>

<div id="toast-container"></div>

<div class="modal-overlay" id="settings-modal" style="display:none">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <strong style="font-size:15px;">Settings</strong>
      <span class="toolbar-btn" id="modal-close" style="font-size:16px;">&times;</span>
    </div>
    <h4 style="margin-bottom:8px;font-size:13px;">Blogger Integration</h4>
    <div style="display:grid;gap:8px;">
      <input class="settings-input" id="b-client-id" placeholder="Client ID" />
      <input class="settings-input" id="b-client-secret" placeholder="Client Secret" />
      <input class="settings-input" id="b-blog-id" placeholder="Blog ID" />
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="settings-btn" id="btn-save-blogger">Save</button>
        <button class="settings-btn" id="btn-connect-blogger" style="background:var(--accent);color:#fff;">Connect to Blogger</button>
      </div>
      <div id="blogger-status" style="font-size:12px;color:var(--fg2);margin-top:4px;"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="props-modal" style="display:none">
  <div class="modal-content" style="width:500px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <strong style="font-size:15px;">Feed Properties</strong>
      <span class="toolbar-btn" id="props-close" style="font-size:16px;">&times;</span>
    </div>
    <div id="props-body"></div>
  </div>
</div>

<script src="./app.js?v=8"></script>
</body>
</html>
